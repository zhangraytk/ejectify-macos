# Cloud build of upstream Ejectify (MIT-licensed).
# Place in a FORK of https://github.com/nielsmouthaan/ejectify-macos
# as .github/workflows/build-ejectify.yml.
name: Build Ejectify for Apple Silicon

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/build-ejectify.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Check Xcode and Swift toolchain
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          swiftc -version
          # Diagnostics 7.0 uses nonisolated(nonsending), introduced in Swift 6.2.
          swiftc -version | grep -Eq 'Swift version (6\.([2-9]|[1-9][0-9])\.|[7-9]\.|[1-9][0-9]\.)' \
            || { echo 'Error: Ejectify dependencies require Swift 6.2 or newer.' >&2; exit 1; }
      - name: Resolve Swift package dependencies
        run: xcodebuild -resolvePackageDependencies -project Ejectify.xcodeproj -scheme Ejectify
      - name: Build for arm64 (without developer certificate)
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project Ejectify.xcodeproj \
            -scheme Ejectify \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/EjectifyDerived" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM='' \
            build
      - name: Apply local ad-hoc signature and package
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/EjectifyDerived/Build/Products/Release/Ejectify.app"
          test -f "$APP/Contents/MacOS/Ejectify"
          file "$APP/Contents/MacOS/Ejectify"
          # A local ad-hoc signature is not Developer ID notarization.
          codesign --force --deep --sign - --timestamp=none "$APP"
          codesign --verify --deep --verbose=2 "$APP"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/Ejectify-arm64.zip"
          shasum -a 256 "$RUNNER_TEMP/Ejectify-arm64.zip" | tee "$RUNNER_TEMP/SHA256.txt"
      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ejectify-arm64-unsigned
          path: |
            ${{ runner.temp }}/Ejectify-arm64.zip
            ${{ runner.temp }}/SHA256.txt
          if-no-files-found: error
          retention-days: 7
